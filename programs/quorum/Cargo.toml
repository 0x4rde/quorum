[package]
name = "quorum"
version = "0.1.0"
description = "Quorum: issuer-diversified RWA vaults on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "quorum"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.2", features = ["token_2022", "token_2022_extensions"] }
pyth-solana-receiver-sdk = "1.2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

# The Solana platform-tools that ship with solana-cli 2.1.15 build proc macros
# with cargo 1.79, which does not understand edition 2024. Several crates deep in
# the borsh/num_enum proc-macro graph have since moved to it, so we hold the
# whole subtree at the last edition-2021 versions. These are build-time only and
# do not affect the on-chain binary. Remove once the toolchain is upgraded.
[build-dependencies]
proc-macro-crate = "=3.2.0"
indexmap = "=2.7.1"
